<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blue Insights 2011 SL</title>
    <meta
      name="description"
      content="Blue Insights 2011 SL — Consultoría e inversión inteligente. Próximamente."
    />
    <meta name="robots" content="index, follow" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%231e3a8a'/%3E%3Ctext x='50' y='62' font-family='Inter,Arial' font-size='32' font-weight='bold' text-anchor='middle' fill='white'%3EBI%3C/text%3E%3C/svg%3E" />

    <!-- Open Graph para que se vea bien si se comparte en WhatsApp / Meta / LinkedIn -->
    <meta property="og:title" content="Blue Insights 2011 SL" />
    <meta property="og:description" content="Consultoría e inversión. Próximamente." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://cmoreno34.github.io/blueinsights/" />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
        color: #1e293b;
        -webkit-font-smoothing: antialiased;
      }
      body {
        background: linear-gradient(135deg, #f8fafc 0%, #e0e7ff 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      .logo-mark {
        width: 88px;
        height: 88px;
        border-radius: 22px;
        background: linear-gradient(135deg, #1e3a8a, #3b82f6);
        color: white;
        font-size: 36px;
        font-weight: 800;
        letter-spacing: -1.5px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 24px;
        box-shadow: 0 20px 40px -10px rgba(30, 58, 138, 0.4);
      }
      h1 {
        font-size: clamp(28px, 5vw, 44px);
        font-weight: 700;
        letter-spacing: -0.02em;
        margin-bottom: 6px;
      }
      .legal-suffix {
        color: #64748b;
        font-weight: 500;
      }
      .tagline {
        font-size: clamp(14px, 2vw, 18px);
        color: #475569;
        font-weight: 400;
        margin-top: 12px;
        max-width: 480px;
        line-height: 1.5;
      }
      .coming-soon {
        margin-top: 32px;
        padding: 8px 20px;
        background: white;
        border: 1px solid #cbd5e1;
        border-radius: 999px;
        font-size: 13px;
        font-weight: 600;
        color: #1e3a8a;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }
      .coming-soon::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #3b82f6;
        animation: pulse 2s infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.5;
          transform: scale(1.4);
        }
      }
      .contact {
        margin-top: 40px;
        font-size: 14px;
        color: #475569;
      }
      .contact a {
        color: #1e3a8a;
        text-decoration: none;
        font-weight: 500;
      }
      .contact a:hover {
        text-decoration: underline;
      }
      footer {
        position: absolute;
        bottom: 20px;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 11px;
        color: #94a3b8;
        padding: 0 16px;
        line-height: 1.6;
      }
      footer strong {
        color: #475569;
      }
    </style>
  </head>
  <body>
    <div class="logo-mark">BI</div>
    <h1>
      Blue Insights <span class="legal-suffix">2011 SL</span>
    </h1>
    <p class="tagline">
      Consultoría estratégica e inversión inteligente.<br />
      Nuestra nueva web está en construcción.
    </p>

    <div class="coming-soon">Próximamente</div>

    <p class="contact">
      Contacto:
      <a href="mailto:cesarmorenopa@gmail.com">cesarmorenopa@gmail.com</a>
    </p>

    <footer>
      <strong>Blue Insights 2011 SL</strong> · CIF B-XXXXXXXX<br />
      Dirección social: <em>Madrid, España</em> &middot;
      &copy; 2011-2026
    </footer>
  </body>
</html>
